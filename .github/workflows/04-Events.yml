name: 04 - Events

on:
  issues:
    types:
      - opened
      - assigned
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

jobs:
  inspect-event:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Mostrar evento
        run: |
          echo "Evento: ${{ github.event_name }}"

      - name: Mostrar numero de issue
        run: |
          echo "Numero de issue: ${{ github.event.issue.number }}"

      - name: Mostrar cuerpo de comentario
        if: ${{ github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' }}
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "Cuerpo del comentario: $COMMENT_BODY"

      - name: Comentar en issue nueva (bot)
        if: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "Gracias por el aporte!"